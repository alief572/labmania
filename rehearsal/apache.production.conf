# Production di balik reverse proxy host: prefix /labmania dipertahankan end-to-end.
# DocumentRoot tetap melayani /up untuk healthcheck container.
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/laravel/public
    Alias /labmania /var/www/laravel/public
    <Directory /var/www/laravel/public>
        Options -Indexes +SymLinksIfOwnerMatch
        # .htaccess tidak dipakai: RewriteBase tidak diwariskan ke sana, sehingga rewrite ke
        # index.php menghasilkan SCRIPT_NAME=/index.php dan Laravel kehilangan base path /labmania.
        # FallbackResource menjaga SCRIPT_NAME=/labmania/index.php; file statis tetap dilayani langsung.
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
        FallbackResource /labmania/index.php
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"
    Header always set X-Frame-Options "SAMEORIGIN"
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
