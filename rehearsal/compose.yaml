name: labmania-rehearsal

services:
  app:
    build:
      context: ..
      dockerfile: rehearsal/Dockerfile
    command: ['sh', '-c', 'chown -R www-data:www-data storage && exec apache2-foreground']
    env_file: '${REHEARSAL_ENV_FILE:-.env.rehearsal}'
    environment:
      APP_ENV: rehearsal
      APP_DEBUG: 'false'
      APP_URL: http://127.0.0.1:8090
      DB_CONNECTION: mysql
      DB_HOST: rehearsal-db
      DB_PORT: '3306'
      DB_DATABASE: labmania_laravel
      DB_USERNAME: labmania_rehearsal
      MIGRATION_SOURCE_HOST: rehearsal-db
      MIGRATION_SOURCE_DATABASE: labmania_legacy_snapshot
      MIGRATION_SOURCE_USERNAME: snapshot_reader
      SESSION_COOKIE: labmania_rehearsal_session
      SESSION_SECURE_COOKIE: 'false'
      SESSION_DRIVER: file
      SESSION_ENCRYPT: 'true'
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      AUDIT_RETENTION_ENABLED: 'false'
      LEGACY_DOCUMENT_ROOT: ''
      PARTICIPANT_FONT_DIR: /fonts
    ports:
      - '127.0.0.1:8090:80'
    volumes:
      - app_storage:/var/www/laravel/storage
      - '${REHEARSAL_SNAPSHOT_DIR:?Set lokasi snapshot lengkap}:/snapshot:ro'
      - '${REHEARSAL_FONT_DIR:?Set folder font berlisensi}:/fonts:ro'
      - '${REHEARSAL_BACKUP_DIR:?Set folder backup privat}:/backups'
    depends_on:
      rehearsal-db:
        condition: service_healthy
    networks: [rehearsal]

  rehearsal-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: labmania_laravel
      MYSQL_USER: labmania_rehearsal
      MYSQL_PASSWORD: '${DB_PASSWORD:?Set password target}'
      MYSQL_ROOT_PASSWORD: '${REHEARSAL_DB_ROOT_PASSWORD:?Set password root rehearsal}'
      SNAPSHOT_READER_PASSWORD: '${MIGRATION_SOURCE_PASSWORD:?Set password baca snapshot}'
      SNAPSHOT_LOADER_PASSWORD: '${MIGRATION_LOADER_PASSWORD:?Set password loader snapshot}'
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/schema/rehearsal.mysql.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ./20-snapshot.sh:/docker-entrypoint-initdb.d/20-snapshot.sh:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [rehearsal]

networks:
  rehearsal:
    internal: true

volumes:
  mysql_data:
  app_storage:
