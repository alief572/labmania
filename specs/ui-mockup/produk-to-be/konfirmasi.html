<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Konfirmasi Kehadiran Peserta · LabMania (Mockup To Be)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="konf-body">
  <!-- To be (input/Master - Buat Program/2026-11-06-to-be-kuota-link-konfirmasi/): halaman yang dibuka calon peserta dari
       link Konfirmasi Kehadiran quotation. Mockup tanpa server: konfigurasi link dibaca dari localStorage yang ditulis
       mockup utama (Labmania.html), isian dikirim balik lewat localStorage dan masuk ke tab Data Peserta quotation.
       Surat konfirmasi bertanda tangan basah (input/Master - Buat Program/2026-11-10-surat-konfirmasi-ttd-basah/): calon peserta mencetak surat
       yang sudah terisi datanya, menandatangani, lalu mengunggah hasil foto/pindai. Unggahan wajib.
       B2B (input/Master - Buat Program/2026-11-10-b2b-paket-25-konfirmasi-company/): link diisi satu kali oleh PIC company
       (data company/PIC + daftar peserta), surat konfirmasi atas nama company + lampiran daftar peserta.
       Reschedule (input/Master - Buat Program/2026-11-12-jawaban-reschedule-refund-asisten/): link lama ditutup; link baru meminta
       peserta terdaftar konfirmasi ulang: pindah jadwal (ikut jadwal baru, surat bertanggal baru), lalu batal ikut (belum bayar) atau refund (sudah bayar). -->
  <header class="konf-top"><span class="konf-brand">LabMania</span><span class="konf-sub">Konfirmasi Kehadiran Peserta</span></header>
  <main class="konf-main" id="konf" aria-live="polite"><p class="muted">Memuat formulir…</p></main>
  <footer class="konf-foot">PT LabMania Indonesia Jaya · Mockup to be, data contoh</footer>
  <div class="konf-cetak pdf-doc" id="konf-cetak" aria-hidden="true"></div>

  <script>
  'use strict';
  (function () {
    const $ = s => document.querySelector(s);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const lsGet = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const telpOk = v => /^\+?\d{9,15}$/.test(v.replace(/[\s-]/g, ''));
    const pad = n => String(n).padStart(2, '0');
    const stamp = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    const token = new URLSearchParams(location.search).get('t') || '';
    const box = $('#konf');
    const kunci = { link: `labmania-tobe:link:${token}`, isian: `labmania-tobe:isian:${token}` };

    const pesan = (judul, isi) => { box.innerHTML = `<h1>${esc(judul)}</h1><div class="pub-closed">${isi}</div>`; };
    const hariIni = stamp().slice(0, 10);
    const tglId = iso => iso ? iso.split('-').reverse().join('-') : '';
    const BULAN = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
    const tglPanjang = iso => { const [y, m, d] = iso.split('-'); return `${+d} ${BULAN[+m - 1]} ${y}`; };
    // Surat konfirmasi: tipe dan ukuran berkas (usulan, Q-TB-09). Mockup menyimpan isi berkas di localStorage hanya bila kecil.
    const SURAT_TIPE = ['application/pdf', 'image/jpeg', 'image/png'], SURAT_MAX = 5 * 1024 * 1024, SIMPAN_MAX = 1.5 * 1024 * 1024;
    const kb = n => n >= 1048576 ? `${(n / 1048576).toFixed(1).replace('.', ',')} MB` : `${Math.max(1, Math.round(n / 1024))} KB`;
    const lewat = cfg => !!cfg.berlaku && hariIni > cfg.berlaku;
    const sisa = cfg => { const list = lsGet(kunci.isian) || []; return Math.max(cfg.kuota - cfg.terisi - list.filter(x => !x.imp && !String(x.tipe || '').startsWith('ulang')).length, 0); };
    const head = (cfg, n) => `<div class="pub-head"><div><b>${esc(cfg.judul)}</b><small>${esc(cfg.jadwal)}${cfg.waktu ? ` · ${esc(cfg.waktu)}` : ''} · ${esc(cfg.lokasi || 'lokasi menyusul')}</small>
      <small>Quotation ${esc(cfg.nomor)} · ${esc(cfg.kepada)}${cfg.berlaku ? ` · formulir berlaku s.d. ${esc(tglId(cfg.berlaku))}` : ''}</small></div>${n !== undefined ? `<span class="konf-sisa"><b>${n}</b> kursi tersisa</span>` : ''}</div>`;

    let mode = ''; // '' = pilih, 'ulang' = konfirmasi ulang, 'baru' = pendaftar baru
    function form(cfg) {
      if (cfg.diganti) { pesan('Link ini sudah diganti', '<p><b>Jadwal program berubah.</b> Link ini tidak dipakai lagi. Minta link terbaru ke Sales LabMania.</p>'); return; }
      const ulang = cfg.ulang && cfg.ulang.buka ? sisaUlang(cfg) : [];
      if (ulang.length && mode !== 'baru') {
        if (cfg.b2b) { formUlangB2b(cfg, ulang); return; }
        const daftarBuka = cfg.buka && !lewat(cfg) && sisa(cfg) > 0;
        if (!daftarBuka || mode === 'ulang') { formUlang(cfg, ulang); return; }
        box.innerHTML = `<h1>Konfirmasi Kehadiran</h1>${head(cfg)}${bannerUlang(cfg)}
          <div class="konf-pilih"><button type="button" class="btn btn-primary" id="m-ulang">Saya sudah terdaftar: konfirmasi ulang</button>
          <button type="button" class="btn btn-outline" id="m-baru">Saya pendaftar baru</button></div>`;
        $('#m-ulang').addEventListener('click', () => { mode = 'ulang'; form(cfg); });
        $('#m-baru').addEventListener('click', () => { mode = 'baru'; form(cfg); });
        $('#m-ulang').focus();
        return;
      }
      if (cfg.b2b) { formB2b(cfg); return; }
      const n = sisa(cfg);
      if (!cfg.buka || lewat(cfg) || n <= 0) {
        box.innerHTML = `<h1>Konfirmasi Kehadiran</h1>${head(cfg)}<div class="pub-closed"><p><b>Formulir ini sudah ditutup.</b></p>
          <p>${!cfg.buka ? `Quotation berstatus ${esc(cfg.status)}.` : lewat(cfg) ? `Masa berlaku quotation berakhir ${esc(tglId(cfg.berlaku))}.` : `Kuota ${esc(cfg.kuota)} peserta sudah terisi.`} Hubungi Sales LabMania${cfg.sales ? ` (${esc(cfg.sales)})` : ''} bila Anda belum terdaftar.</p></div>`;
        return;
      }
      const fields = cfg.isian.map(f => {
        const id = `f-${f.key.replace(/[^\w-]/g, '_')}`, val = f.key === 'instansi' && cfg.instansi ? cfg.instansi : '';
        const ph = f.type === 'email' ? 'nama@domain.com' : f.type === 'tel' ? '08xxxxxxxxxx' : '';
        return `<div class="field"><label for="${id}">${esc(f.label)}${f.wajib ? ' <span class="req" aria-hidden="true">*</span>' : ''}</label>
          <input class="input" id="${id}" name="${esc(f.key)}" type="${esc(f.type)}" value="${esc(val)}" maxlength="150" ${ph ? `placeholder="${ph}"` : ''} ${f.type === 'tel' ? 'inputmode="tel"' : ''} ${f.wajib ? 'required aria-required="true"' : ''}>
          ${f.key === 'nama' ? '<span class="hint">Nama lengkap menjadi acuan penulisan di sertifikat.</span>' : ''}</div>`;
      }).join('');
      box.innerHTML = `<h1>Konfirmasi Kehadiran</h1>${head(cfg, n)}
        <p class="konf-lead">Isi data diri Anda sebagai calon peserta. Satu formulir untuk satu orang; bila mendaftarkan beberapa orang, kirim satu per satu.</p>
        <form id="konf-form" novalidate>
          <section class="konf-sec"><h2>1. Data diri</h2><p class="konf-req"><span class="req" aria-hidden="true">*</span> wajib diisi</p>
            <div class="grid2">${fields}</div></section>
          <section class="konf-sec"><h2>2. Pernyataan</h2>
            ${`<p>Dengan ini saya menyatakan:</p><ol class="pdf-small-ol konf-pernyataan"><li>${cfg.pernyataan}</li><li>Saya telah membaca dan menyetujui syarat &amp; ketentuan yang berlaku di LabMania.</li></ol>`}
            <div class="field"><label class="chk konf-setuju" for="f-setuju"><input type="checkbox" id="f-setuju" name="setuju"> Saya menyetujui pernyataan di atas.</label></div></section>
          <section class="konf-sec"><h2>3. Surat konfirmasi bertanda tangan</h2>
            <p class="konf-req">Kami membutuhkan surat dengan tanda tangan basah.</p>
            <ol class="konf-langkah">
              <li>Cetak surat konfirmasi. Data diri yang Anda isi di atas sudah tercetak di surat.
                <div><button type="button" class="btn btn-outline konf-cetak-btn" id="konf-cetak-btn">Cetak surat konfirmasi</button></div></li>
              <li>Isi tempat, lalu tanda tangani surat dengan pena.</li>
              <li>Foto atau pindai surat itu, lalu unggah di bawah ini.</li>
            </ol>
            <div class="field"><label for="f-surat">Surat konfirmasi yang sudah ditandatangani <span class="req" aria-hidden="true">*</span></label>
              <input class="input konf-file" id="f-surat" name="surat" type="file" accept="application/pdf,image/jpeg,image/png" required aria-required="true" aria-describedby="h-surat">
              <span class="hint" id="h-surat">PDF, JPG, atau PNG, maksimal 5 MB. Dari ponsel, Anda bisa langsung memotret surat.</span></div></section>
          <button type="submit" class="btn btn-primary konf-kirim">Kirim konfirmasi</button>
        </form>`;
      $('#konf-form').addEventListener('submit', e => { e.preventDefault(); kirim(cfg, e.target); });
      $('#konf-cetak-btn').addEventListener('click', () => cetak(cfg, $('#konf-form')));
      $('#f-surat').addEventListener('change', e => { const w = e.target.closest('.field'); w.classList.remove('has-err'); w.querySelectorAll('.err').forEach(x => x.remove()); cekSurat(e.target); });
      const first = box.querySelector('.input'); if (first) first.focus();
    }

    function salah(el, msg) {
      const w = el.closest('.field'); w.classList.add('has-err');
      w.insertAdjacentHTML('beforeend', `<div class="err" role="alert"><i>!</i>${esc(msg)}</div>`);
      return false;
    }
    function bersih(f) { f.querySelectorAll('.has-err').forEach(x => x.classList.remove('has-err')); f.querySelectorAll('.err').forEach(x => x.remove()); }
    function cekIsian(cfg, f) {
      const data = {}; let ok = true;
      cfg.isian.forEach(fi => {
        const el = f.elements[fi.key], v = el.value.trim(); data[fi.key] = v;
        if (fi.wajib && !v) ok = salah(el, `${fi.label} wajib diisi`);
        else if (fi.type === 'email' && v && !EMAIL_RE.test(v)) ok = salah(el, 'Format email tidak valid');
        else if (fi.type === 'tel' && v && !telpOk(v)) ok = salah(el, 'Nomor hanya angka, 9 sampai 15 digit');
      });
      return ok ? data : null;
    }
    function cekSurat(el) {
      const file = el.files[0];
      if (!file) return salah(el, 'Unggah surat konfirmasi yang sudah ditandatangani');
      if (!SURAT_TIPE.includes(file.type)) return salah(el, 'Berkas harus PDF, JPG, atau PNG');
      if (file.size > SURAT_MAX) return salah(el, `Berkas ${kb(file.size)}, maksimal 5 MB`);
      return true;
    }
    const fokusSalah = f => { const x = f.querySelector('.has-err input'); if (x) x.focus(); };
    // Cetak surat konfirmasi: template dari quotation (format FR/LMI-TR-01/02) diisi data yang diketik, tanggal = hari cetak.
    function cetak(cfg, f) {
      bersih(f);
      const data = cekIsian(cfg, f);
      if (!data) { fokusSalah(f); return; }
      if (!cfg.surat) { pesan('Surat belum tersedia', '<p>Buka ulang link dari Sales LabMania.</p>'); return; }
      $('#konf-cetak').innerHTML = cfg.surat.replace(/\[\[(\d+|tgl)\]\]/g, (m, x) => x === 'tgl' ? tglPanjang(hariIni) : esc(data[(cfg.isian[+x] || {}).key] || ''));
      window.print();
    }
    function kirim(cfg, f) {
      bersih(f);
      let data = cekIsian(cfg, f), ok = !!data;
      if (!f.elements.setuju.checked) ok = salah(f.elements.setuju, 'Centang persetujuan untuk mengirim');
      if (!cekSurat(f.elements.surat)) ok = false;
      if (!ok) { fokusSalah(f); return; }
      const file = f.elements.surat.files[0], surat = { nama: file.name, ukuran: file.size, tipe: file.type };
      if (file.size > SIMPAN_MAX) { simpan(cfg, data, surat); return; }
      const rd = new FileReader();
      rd.onload = () => simpan(cfg, data, Object.assign({ url: rd.result }, surat));
      rd.onerror = () => simpan(cfg, data, surat);
      rd.readAsDataURL(file);
    }
    function simpan(cfg, data, surat) {
      const now = lsGet(kunci.link) || cfg;
      if (!now.buka || lewat(now) || sisa(now) <= 0) { form(now); return; }
      const list = lsGet(kunci.isian) || [];
      const isian = { id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, tgl: stamp(), data, surat };
      list.push(isian);
      // Mockup: bila browser penuh, simpan tanpa isi berkas (nama dan ukuran tetap tercatat).
      if (!lsSet(kunci.isian, list) && surat.url) { delete surat.url; }
      if (!lsSet(kunci.isian, list)) { pesan('Gagal mengirim', '<p>Browser menolak menyimpan data. Coba lagi, atau kirim data Anda ke Sales LabMania.</p>'); return; }
      box.innerHTML = `<div class="konf-ok"><span class="konf-ok-mark" aria-hidden="true">✓</span><h1>Terima kasih, ${esc(data.nama)}</h1></div>${head(cfg)}
        <div class="pub-closed"><p><b>Konfirmasi kehadiran Anda sudah kami terima.</b></p>
          <p>Data Anda dan surat konfirmasi <b>${esc(surat.nama)}</b> masuk ke quotation ${esc(cfg.nomor)}. Sales LabMania${cfg.sales ? ` (${esc(cfg.sales)})` : ''} akan menghubungi Anda bila ada yang perlu dilengkapi.</p></div>
        <p class="konf-lagi"><button type="button" class="btn btn-outline" id="konf-lagi">Isi untuk peserta lain</button></p>
        <p class="hint">Mockup: kembali ke tab Labmania untuk melihat isian ini di tab Data Peserta.</p>`;
      $('#konf-lagi').addEventListener('click', () => form(lsGet(kunci.link) || cfg));
      $('#konf-lagi').focus();
    }

    // ---------- B2B: satu kiriman oleh PIC company ----------
    const rp = n => `Rp${Number(n || 0).toLocaleString('id-ID')}`;
    const B2B_MIN = 10;
    let rows = [];
    const sudahKirim = cfg => cfg.sudahKirim || (lsGet(kunci.isian) || []).length > 0;
    function formB2b(cfg) {
      if (!cfg.buka || lewat(cfg) || sudahKirim(cfg)) {
        box.innerHTML = `<h1>Konfirmasi Kehadiran</h1>${head(cfg)}<div class="pub-closed"><p><b>Formulir ini sudah ditutup.</b></p>
          <p>${sudahKirim(cfg) ? 'Daftar peserta perusahaan sudah dikirim.' : !cfg.buka ? `Quotation berstatus ${esc(cfg.status)}.` : `Masa berlaku quotation berakhir ${esc(tglId(cfg.berlaku))}.`} Untuk perubahan, hubungi Sales LabMania${cfg.sales ? ` (${esc(cfg.sales)})` : ''}.</p></div>`;
        return;
      }
      const c = cfg.company || {}, kol = cfg.kolom || [];
      rows = Array.from({ length: Math.max(Number(cfg.kuota) || 0, B2B_MIN) }, () => ({}));
      const coF = [['nama', 'Nama Perusahaan', 'text'], ['alamat', 'Alamat Perusahaan', 'text'], ['pic', 'Nama PIC', 'text'], ['jab', 'Jabatan PIC', 'text'], ['hp', 'Nomor HP / WhatsApp PIC', 'tel'], ['email', 'Email PIC', 'email']];
      box.innerHTML = `<h1>Konfirmasi Kehadiran</h1>${head(cfg)}
        <p class="konf-lead">Formulir ini diisi <b>satu kali oleh PIC perusahaan</b> untuk seluruh peserta in-house. Isi data perusahaan, daftar peserta, lalu unggah surat konfirmasi yang sudah ditandatangani dan dicap.</p>
        <form id="konf-form" novalidate>
          <section class="konf-sec"><h2>1. Data perusahaan dan PIC</h2><p class="konf-req"><span class="req" aria-hidden="true">*</span> wajib diisi</p>
            <div class="grid2">${coF.map(([k, l, t]) => `<div class="field"><label for="c-${k}">${l} <span class="req" aria-hidden="true">*</span></label>
              <input class="input" id="c-${k}" name="c-${k}" type="${t}" value="${esc(c[k] || '')}" maxlength="150" ${t === 'tel' ? 'inputmode="tel"' : ''} required aria-required="true"></div>`).join('')}</div></section>
          <section class="konf-sec"><h2>2. Daftar peserta</h2>
            <p class="konf-req">Nama lengkap menjadi acuan penulisan di sertifikat.${kol.length ? ' Kolom lain boleh dikosongkan.' : ''}</p>
            <div id="ps-list" class="ps-list"></div>
            <div class="ps-tools field"><button type="button" class="btn btn-outline" id="ps-add">+ Tambah peserta</button></div>
            <details class="ps-tempel"><summary>Tempel daftar nama dari Excel atau WhatsApp</summary>
              <label class="sr-only" for="ps-paste">Daftar nama, satu per baris</label>
              <textarea class="input" id="ps-paste" rows="5" placeholder="Satu nama per baris${kol.length ? `. Dari Excel: kolom Nama${kol.map(x => `, ${x.label}`).join('')}` : ''}"></textarea>
              <button type="button" class="btn btn-outline" id="ps-paste-ok">Masukkan ke daftar</button></details>
            <p class="hint" id="ps-count" aria-live="polite"></p></section>
          <section class="konf-sec"><h2>3. Pernyataan</h2>
            <p>Dengan ini perusahaan kami menyatakan mengikutsertakan peserta di atas pada kegiatan ini, dan telah membaca serta menyetujui syarat &amp; ketentuan yang berlaku di LabMania.</p>
            <div class="field"><label class="chk konf-setuju" for="f-setuju"><input type="checkbox" id="f-setuju" name="setuju"> Saya menyetujui pernyataan di atas atas nama perusahaan.</label></div></section>
          <section class="konf-sec"><h2>4. Surat konfirmasi perusahaan</h2>
            <p class="konf-req">Kami membutuhkan surat dengan tanda tangan basah dan cap perusahaan.</p>
            <ol class="konf-langkah">
              <li>Cetak surat konfirmasi. Data perusahaan dan daftar peserta di atas sudah tercetak, daftar peserta sebagai lampiran.
                <div><button type="button" class="btn btn-outline konf-cetak-btn" id="konf-cetak-btn">Cetak surat konfirmasi</button></div></li>
              <li>Isi tempat, tanda tangani dengan pena, dan beri cap perusahaan.</li>
              <li>Foto atau pindai surat dan lampirannya, lalu unggah di bawah ini.</li>
            </ol>
            <div class="field"><label for="f-surat">Surat konfirmasi yang sudah ditandatangani dan dicap <span class="req" aria-hidden="true">*</span></label>
              <input class="input konf-file" id="f-surat" name="surat" type="file" accept="application/pdf,image/jpeg,image/png" required aria-required="true" aria-describedby="h-surat">
              <span class="hint" id="h-surat">PDF, JPG, atau PNG, maksimal 5 MB. Gabungkan surat dan lampiran dalam satu berkas PDF bila lebih dari satu halaman.</span></div></section>
          <button type="submit" class="btn btn-primary konf-kirim">Kirim daftar peserta</button>
        </form>`;
      const f = $('#konf-form');
      gambarBaris(cfg);
      f.addEventListener('input', e => { const t = e.target, i = t.dataset.r; if (i !== undefined) { rows[+i][t.dataset.k] = t.value; if (t.dataset.k === 'nama') hitung(cfg); } });
      f.addEventListener('click', e => {
        const del = e.target.closest('[data-del]');
        if (del) { rows.splice(+del.dataset.del, 1); if (!rows.length) rows.push({}); gambarBaris(cfg); return; }
        if (e.target.id === 'ps-add') { rows.push({}); gambarBaris(cfg); const x = f.querySelectorAll('[data-k="nama"]'); x[x.length - 1].focus(); return; }
        if (e.target.id === 'ps-paste-ok') { tempel(cfg); return; }
        if (e.target.id === 'konf-cetak-btn') { cetakB2b(cfg, f); }
      });
      f.addEventListener('submit', e => { e.preventDefault(); kirimB2b(cfg, f); });
      $('#f-surat').addEventListener('change', e => { const w = e.target.closest('.field'); w.classList.remove('has-err'); w.querySelectorAll('.err').forEach(x => x.remove()); cekSurat(e.target); });
      $('#c-pic').focus();
    }
    function gambarBaris(cfg) {
      const kol = cfg.kolom || [];
      $('#ps-list').innerHTML = rows.map((r, i) => `<div class="ps-row field"><span class="ps-no" aria-hidden="true">${i + 1}</span>
          <div class="ps-cells"><input class="input" data-r="${i}" data-k="nama" value="${esc(r.nama || '')}" maxlength="150" placeholder="Nama lengkap" aria-label="Nama lengkap peserta ${i + 1}">
          ${kol.map(x => `<input class="input" data-r="${i}" data-k="${esc(x.key)}" type="${esc(x.type)}" value="${esc(r[x.key] || '')}" maxlength="150" placeholder="${esc(x.label)}" aria-label="${esc(x.label)} peserta ${i + 1}" ${x.type === 'tel' ? 'inputmode="tel"' : ''}>`).join('')}</div>
          <button type="button" class="btn btn-ghost sm" data-del="${i}" aria-label="Hapus peserta ${i + 1}">Hapus</button></div>`).join('');
      hitung(cfg);
    }
    const terisi = () => rows.filter(r => (r.nama || '').trim());
    function hitung(cfg) {
      const n = terisi().length, maks = cfg.paketMaks || 25, lebih = Math.max(n - maks, 0);
      $('#ps-count').innerHTML = `<b>${n}</b> peserta. Minimal ${B2B_MIN} peserta; harga paket mencakup s.d. ${maks} peserta.${lebih ? ` <b>${lebih} peserta di atas ${maks}</b> dikenakan tambahan ${rp(cfg.tambahPs)}/orang sesuai quotation.` : ''}`;
    }
    function tempel(cfg) {
      const kol = cfg.kolom || [], ta = $('#ps-paste');
      const baru = ta.value.split(/\r?\n/).map(l => l.split('\t').map(x => x.trim())).filter(c => c[0]);
      if (!baru.length) return;
      baru.forEach(c => { const r = { nama: c[0] }; kol.forEach((x, i) => { if (c[i + 1]) r[x.key] = c[i + 1]; });
        const kosong = rows.findIndex(x => !(x.nama || '').trim()); if (kosong >= 0) rows[kosong] = r; else rows.push(r); });
      ta.value = ''; gambarBaris(cfg); ta.closest('details').open = false;
      $('#ps-count').insertAdjacentHTML('afterbegin', `${baru.length} nama dimasukkan. `);
    }
    function cekB2b(cfg, f) {
      let ok = true; const co = {};
      ['nama', 'alamat', 'pic', 'jab', 'hp', 'email'].forEach(k => {
        const el = f.elements[`c-${k}`], v = el.value.trim(); co[k] = v;
        if (!v) ok = salah(el, 'Wajib diisi');
        else if (k === 'email' && !EMAIL_RE.test(v)) ok = salah(el, 'Format email tidak valid');
        else if (k === 'hp' && !telpOk(v)) ok = salah(el, 'Nomor hanya angka, 9 sampai 15 digit');
      });
      const kol = cfg.kolom || [], list = [];
      rows.forEach((r, i) => {
        const nama = (r.nama || '').trim(), lain = kol.some(x => (r[x.key] || '').trim());
        const el = f.querySelector(`[data-r="${i}"][data-k="nama"]`);
        if (!nama) { if (lain) ok = salah(el, `Nama peserta ${i + 1} wajib diisi`); return; }
        const p = { nama }; kol.forEach(x => { p[x.key] = (r[x.key] || '').trim(); });
        if (p.email && !EMAIL_RE.test(p.email)) ok = salah(el, `Email peserta ${i + 1} tidak valid`);
        if (p.wa && !telpOk(p.wa)) ok = salah(el, `Nomor WhatsApp peserta ${i + 1}: angka 9 sampai 15 digit`);
        list.push(p);
      });
      if (list.length < B2B_MIN) ok = salah($('#ps-add'), `Minimal ${B2B_MIN} peserta (baru ${list.length})`);
      return ok ? { co, list } : null;
    }
    function cetakB2b(cfg, f) {
      bersih(f);
      const d = cekB2b(cfg, f);
      if (!d) { fokusSalah(f); return; }
      const kol = cfg.kolom || [];
      const isi = d.list.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.nama)}</td>${kol.map(x => `<td>${esc(p[x.key] || '')}</td>`).join('')}</tr>`).join('');
      $('#konf-cetak').innerHTML = cfg.surat.replace(/\[\[(\w+)\]\]/g, (m, x) => x === 'tgl' ? tglPanjang(hariIni) : x === 'rows' ? isi : x === 'n' ? String(d.list.length) : x === 'co' ? esc(d.co.nama) : esc(d.co[x] || ''));
      window.print();
    }
    function kirimB2b(cfg, f) {
      bersih(f);
      const d = cekB2b(cfg, f); let ok = !!d;
      if (!f.elements.setuju.checked) ok = salah(f.elements.setuju, 'Centang persetujuan untuk mengirim');
      if (!cekSurat(f.elements.surat)) ok = false;
      if (!ok) { fokusSalah(f); return; }
      const file = f.elements.surat.files[0], surat = { nama: file.name, ukuran: file.size, tipe: file.type };
      const simpanB2b = sr => {
        const now = lsGet(kunci.link) || cfg;
        if (!now.buka || lewat(now) || sudahKirim(now)) { formB2b(now); return; }
        const list = [{ id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, tgl: stamp(), tipe: 'b2b', co: d.co, peserta: d.list, surat: sr }];
        if (!lsSet(kunci.isian, list) && sr.url) delete sr.url;
        if (!lsSet(kunci.isian, list)) { pesan('Gagal mengirim', '<p>Browser menolak menyimpan data. Coba lagi, atau kirim daftar peserta ke Sales LabMania.</p>'); return; }
        box.innerHTML = `<div class="konf-ok"><span class="konf-ok-mark" aria-hidden="true">✓</span><h1>Terima kasih, ${esc(d.co.pic)}</h1></div>${head(cfg)}
          <div class="pub-closed"><p><b>Daftar ${d.list.length} peserta ${esc(d.co.nama)} sudah kami terima.</b></p>
            <p>Surat konfirmasi <b>${esc(sr.nama)}</b> masuk ke quotation ${esc(cfg.nomor)}. Untuk perubahan daftar, hubungi Sales LabMania${cfg.sales ? ` (${esc(cfg.sales)})` : ''}.</p></div>
          <p class="hint">Mockup: kembali ke tab Labmania untuk melihat daftar ini di tab Data Peserta.</p>`;
      };
      if (file.size > SIMPAN_MAX) { simpanB2b(surat); return; }
      const rd = new FileReader();
      rd.onload = () => simpanB2b(Object.assign({ url: rd.result }, surat));
      rd.onerror = () => simpanB2b(surat);
      rd.readAsDataURL(file);
    }

    // ---------- Konfirmasi ulang setelah reschedule (QTN-FR-35) ----------
    const sudahUlang = cfg => (lsGet(kunci.isian) || []).filter(x => (x.tipe === 'ulang' || x.tipe === 'ulang-b2b') && x.rev === cfg.ulang.rev && !x.imp);
    const sisaUlang = cfg => { const s = sudahUlang(cfg); if (s.some(x => x.tipe === 'ulang-b2b')) return []; return cfg.ulang.peserta.filter(p => !s.some(x => x.ps === p.id)); };
    const bannerUlang = cfg => `<div class="konf-ubah" role="note"><p><b>Jadwal program berubah.</b></p><p>Jadwal lama <s>${esc(cfg.ulang.lama)}</s>, jadwal baru <b>${esc(cfg.ulang.baru)}</b>.</p>
      <p>Peserta yang sudah terdaftar diminta konfirmasi ulang: ikut jadwal baru dengan surat konfirmasi bertanggal baru, atau beri tahu bila tidak bisa ikut.</p></div>`;
    const kirimUlang = (cfg, isi, selesai) => {
      const list = lsGet(kunci.isian) || [];
      list.push(Object.assign({ id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, tgl: stamp(), rev: cfg.ulang.rev }, isi));
      if (!lsSet(kunci.isian, list) && isi.surat && isi.surat.url) { delete isi.surat.url; }
      if (!lsSet(kunci.isian, list)) { pesan('Gagal mengirim', '<p>Browser menolak menyimpan data. Coba lagi, atau sampaikan jawaban Anda ke Sales LabMania.</p>'); return; }
      selesai();
    };
    const bacaSurat = (file, lanjut) => {
      const surat = { nama: file.name, ukuran: file.size, tipe: file.type };
      if (file.size > SIMPAN_MAX) { lanjut(surat); return; }
      const rd = new FileReader(); rd.onload = () => lanjut(Object.assign({ url: rd.result }, surat)); rd.onerror = () => lanjut(surat); rd.readAsDataURL(file);
    };
    // Opsi menurut status bayar (input/Master - Buat Program/2026-11-12-pindah-jadwal-batal-invoice/):
    // sudah bayar = Pindah jadwal atau Refund; belum bayar = Pindah jadwal atau Batal ikut. Pindah jadwal = ikut jadwal baru program ini.
    const OPSI = { ikut: 'Pindah jadwal', batal: 'Batal ikut', refund: 'Refund' };
    const opsiHtml = bayar => `<div class="field" role="radiogroup" aria-label="Jawaban">
        <label class="chk"><input type="radio" name="jawab" value="ikut"> <span><b>${OPSI.ikut}</b> <span class="muted">ikut program ini di jadwal baru</span></span></label>
        <label class="chk" id="u-batal" ${bayar ? 'hidden' : ''}><input type="radio" name="jawab" value="batal"> <span><b>${OPSI.batal}</b> <span class="muted">tidak ikut program ini; tagihan dibatalkan</span></span></label>
        <label class="chk" id="u-refund" ${bayar ? '' : 'hidden'}><input type="radio" name="jawab" value="refund"> <span><b>${OPSI.refund}</b> <span class="muted">tidak ikut; pembayaran Anda dikembalikan sesuai syarat &amp; ketentuan</span></span></label></div>`;
    const selesaiUlang = (cfg, siapa, jawab, surat, extra) => {
      box.innerHTML = `<div class="konf-ok"><span class="konf-ok-mark" aria-hidden="true">✓</span><h1>Terima kasih${siapa ? `, ${esc(siapa)}` : ''}</h1></div>${head(cfg)}
        <div class="pub-closed"><p><b>Jawaban Anda sudah kami terima: ${esc(OPSI[jawab])}.</b></p>
        <p>${jawab === 'ikut' ? `${extra || ''}Surat <b>${esc(surat.nama)}</b> masuk ke quotation ${esc(cfg.nomor)}.` : `Sales LabMania${cfg.sales ? ` (${esc(cfg.sales)})` : ''} akan menghubungi Anda${jawab === 'refund' ? ' untuk proses refund' : ''}.`}</p></div>
        ${!cfg.b2b && sisaUlang(cfg).length ? '<p class="konf-lagi"><button type="button" class="btn btn-outline" id="konf-lagi">Konfirmasi untuk peserta lain</button></p>' : ''}
        <p class="hint">Mockup: kembali ke tab Labmania untuk melihat jawaban ini di tab Data Peserta.</p>`;
      const lagi = $('#konf-lagi'); if (lagi) { lagi.addEventListener('click', () => form(lsGet(kunci.link) || cfg)); lagi.focus(); }
    };
    function formUlang(cfg, ulang) {
      box.innerHTML = `<h1>Konfirmasi ulang jadwal baru</h1>${head(cfg)}${bannerUlang(cfg)}
        <form id="konf-form" novalidate>
          <section class="konf-sec"><h2>1. Nama Anda</h2>
            <div class="field"><label for="u-ps">Pilih nama Anda <span class="req" aria-hidden="true">*</span></label>
              <select class="input" id="u-ps" name="ps" required aria-required="true"><option value="">Pilih nama</option>${ulang.map(p => `<option value="${p.id}">${esc(p.nama)}</option>`).join('')}</select>
              <span class="hint">Hanya nama yang belum konfirmasi ulang yang tampil.</span></div></section>
          <section class="konf-sec"><h2>2. Jawaban Anda</h2>${opsiHtml(false)}
            <div id="u-ikut" hidden>
              <ol class="konf-langkah"><li>Cetak surat konfirmasi bertanggal baru. Data Anda dari pendaftaran awal sudah tercetak.
                <div><button type="button" class="btn btn-outline konf-cetak-btn" id="konf-cetak-btn">Cetak surat konfirmasi</button></div></li>
                <li>Tanda tangani dengan pena, foto atau pindai, lalu unggah.</li></ol>
              <div class="field"><label for="f-surat">Surat konfirmasi baru yang sudah ditandatangani <span class="req" aria-hidden="true">*</span></label>
                <input class="input konf-file" id="f-surat" name="surat" type="file" accept="application/pdf,image/jpeg,image/png" aria-describedby="h-surat">
                <span class="hint" id="h-surat">PDF, JPG, atau PNG, maksimal 5 MB.</span></div></div>
            <div id="u-tidak" hidden>
              <div class="field"><label for="u-cat">Catatan untuk Sales (opsional)</label><textarea class="input" id="u-cat" name="catatan" rows="2" maxlength="500" placeholder="mis. bentrok dengan jadwal audit"></textarea></div></div>
          </section>
          <button type="submit" class="btn btn-primary konf-kirim">Kirim jawaban</button>
        </form>`;
      const f = $('#konf-form');
      const pilihPs = () => ulang.find(x => String(x.id) === f.elements.ps.value);
      f.addEventListener('change', e => {
        if (e.target.name === 'ps') { const p = pilihPs(), bayar = !!(p && p.bayar); $('#u-refund').hidden = !bayar; $('#u-batal').hidden = bayar;
          f.querySelectorAll('[name=jawab]').forEach(x => { if (x.closest('label').hidden) x.checked = false; }); }
        if (e.target.name === 'jawab' || e.target.name === 'ps') { const j = (f.querySelector('[name=jawab]:checked') || {}).value; $('#u-ikut').hidden = j !== 'ikut'; $('#u-tidak').hidden = !j || j === 'ikut'; }
      });
      $('#konf-cetak-btn').addEventListener('click', () => {
        bersih(f); const p = pilihPs();
        if (!p) { salah(f.elements.ps, 'Pilih nama Anda dulu'); f.elements.ps.focus(); return; }
        $('#konf-cetak').innerHTML = cfg.surat.replace(/\[\[(\d+|tgl)\]\]/g, (m, x) => x === 'tgl' ? tglPanjang(hariIni) : esc((key => p.data[key] || (key === 'nama' ? p.nama : ''))((cfg.isian[+x] || {}).key)));
        window.print();
      });
      f.addEventListener('submit', e => {
        e.preventDefault(); bersih(f);
        const p = pilihPs(), jawab = (f.querySelector('[name=jawab]:checked') || {}).value;
        let ok = true;
        if (!p) ok = salah(f.elements.ps, 'Pilih nama Anda');
        if (!jawab) ok = salah(f.querySelector('[name=jawab]'), 'Pilih jawaban');
        if (jawab === 'ikut' && !cekSurat(f.elements.surat)) ok = false;
        if (!ok) { const x = f.querySelector('.has-err input, .has-err select'); if (x) x.focus(); return; }
        const done = surat => kirimUlang(cfg, { tipe: 'ulang', ps: p.id, keputusan: jawab, catatan: f.elements.catatan.value.trim(), surat }, () => selesaiUlang(cfg, p.nama, jawab, surat));
        if (jawab === 'ikut') bacaSurat(f.elements.surat.files[0], done); else done(null);
      });
      f.elements.ps.focus();
    }
    function formUlangB2b(cfg, ulang) {
      box.innerHTML = `<h1>Konfirmasi ulang jadwal baru</h1>${head(cfg)}${bannerUlang(cfg)}
        <p class="konf-lead">Diisi <b>satu kali oleh PIC perusahaan</b>.</p>
        <form id="konf-form" novalidate>
          <section class="konf-sec"><h2>1. Jawaban perusahaan</h2>${opsiHtml(cfg.ulang.bayarCo)}</section>
          <section class="konf-sec" id="u-ikut" hidden><h2>2. Peserta yang tetap ikut</h2>
            <p class="konf-req">Hapus centang peserta yang tidak ikut. Minimal ${B2B_MIN} peserta. Peserta baru tidak dapat ditambah di sini; hubungi Sales.</p>
            <div class="ps-list field">${ulang.map(p => `<label class="chk"><input type="checkbox" name="ikut" value="${p.id}" checked> ${esc(p.nama)}</label>`).join('')}</div>
            <h2 class="gap-t">3. Surat konfirmasi perusahaan bertanggal baru</h2>
            <div><button type="button" class="btn btn-outline konf-cetak-btn" id="konf-cetak-btn">Cetak surat konfirmasi</button></div>
            <div class="field"><label for="f-surat">Surat yang sudah ditandatangani dan dicap <span class="req" aria-hidden="true">*</span></label>
              <input class="input konf-file" id="f-surat" name="surat" type="file" accept="application/pdf,image/jpeg,image/png" aria-describedby="h-surat">
              <span class="hint" id="h-surat">PDF, JPG, atau PNG, maksimal 5 MB.</span></div></section>
          <section class="konf-sec" id="u-tidak" hidden><h2>2. Catatan</h2>
            <div class="field"><label for="u-cat">Catatan untuk Sales (opsional)</label><textarea class="input" id="u-cat" name="catatan" rows="2" maxlength="500"></textarea></div></section>
          <button type="submit" class="btn btn-primary konf-kirim">Kirim jawaban</button>
        </form>`;
      const f = $('#konf-form'), c = cfg.company || {};
      f.addEventListener('change', e => { if (e.target.name === 'jawab') { $('#u-ikut').hidden = e.target.value !== 'ikut'; $('#u-tidak').hidden = e.target.value === 'ikut'; } });
      const dipilih = () => [...f.querySelectorAll('[name=ikut]:checked')].map(x => +x.value);
      $('#konf-cetak-btn').addEventListener('click', () => {
        const kol = cfg.kolom || [], ps = ulang.filter(p => dipilih().includes(p.id));
        const isi = ps.map((p, i) => `<tr><td>${i + 1}</td><td>${esc(p.nama)}</td>${kol.map(x => `<td>${esc(p.data[x.key] || '')}</td>`).join('')}</tr>`).join('');
        $('#konf-cetak').innerHTML = cfg.surat.replace(/\[\[(\w+)\]\]/g, (m, x) => x === 'tgl' ? tglPanjang(hariIni) : x === 'rows' ? isi : x === 'n' ? String(ps.length) : x === 'co' ? esc(c.nama) : esc(c[x] || ''));
        window.print();
      });
      f.addEventListener('submit', e => {
        e.preventDefault(); bersih(f);
        const jawab = (f.querySelector('[name=jawab]:checked') || {}).value, ikut = dipilih();
        let ok = true;
        if (!jawab) ok = salah(f.querySelector('[name=jawab]'), 'Pilih jawaban');
        if (jawab === 'ikut' && ikut.length < B2B_MIN) ok = salah(f.querySelector('[name=ikut]'), `Minimal ${B2B_MIN} peserta (baru ${ikut.length})`);
        if (jawab === 'ikut' && !cekSurat(f.elements.surat)) ok = false;
        if (!ok) { const x = f.querySelector('.has-err input'); if (x) x.focus(); return; }
        const done = surat => kirimUlang(cfg, { tipe: 'ulang-b2b', keputusan: jawab, ikut: jawab === 'ikut' ? ikut : [], catatan: f.elements.catatan.value.trim(), surat }, () => selesaiUlang(cfg, '', jawab, surat, `${ikut.length} peserta tetap ikut jadwal baru. `));
        if (jawab === 'ikut') bacaSurat(f.elements.surat.files[0], done); else done(null);
      });
      f.querySelector('[name=jawab]').focus();
    }

    if (!token) { pesan('Link tidak lengkap', '<p>Alamat link tidak memuat kode quotation. Buka link persis seperti yang dikirim Sales LabMania.</p>'); return; }
    const cfg = lsGet(kunci.link);
    if (!cfg) {
      pesan('Link tidak ditemukan', `<p>Kode <b>${esc(token)}</b> tidak dikenali.</p>
        <p class="hint">Mockup: buka Labmania.html di browser yang sama, lalu buka detail quotation-nya sekali agar link aktif. Data mockup hilang saat Labmania.html dimuat ulang, kecuali data contoh.</p>`);
      return;
    }
    form(cfg);
  })();
  </script>
</body>
</html>
