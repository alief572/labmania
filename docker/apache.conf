<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www

    <Directory /var/www>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    <DirectoryMatch "(?i)^/var/www/(?:\.git|\.artifacts|\.aws|\.agents|\.codex|\.vscode|specs|specs_internal|database|application|system|vendor|node_modules|bower_components|docker|scripts|tests|cron|md|nbproject|laravel)(?:/|$)">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(?i)(^\.|\.(?:sql|bak|log|ini|ya?ml|md|lock)$|^(?:composer|package)(?:-lock)?\.json$|^test\.php$|^index_maintenance\.php$)">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
