# Hanya sesudah preflight dan penerimaan data asli; tidak menjalankan bootstrap UAT.
services:
  app:
    profiles: !reset []
    environment:
      APP_URL: http://localhost:8080
      SESSION_COOKIE: labmania_realdata_session
    ports: !override
      - '127.0.0.1:8080:80'
    networks: [rehearsal, gl_source]

networks:
  gl_source:
    external: true
    name: '${COA_LOCAL_NETWORK:-labmania_labmania_net}'
